spring:
  application:
    name: service-request-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/requests}
    username: ${DATABASE_USER:requests}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      enabled: false
server:
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 16KB
    max-swallow-size: 16KB
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
platform:
  auth-mode: ${PLATFORM_AUTH_MODE:oidc}
  requester-token: ${REQUESTER_TOKEN:}
  operator-token: ${OPERATOR_TOKEN:}
  oidc-issuer: ${OIDC_ISSUER:http://127.0.0.1:18112/realms/service-requests}
  oidc-jwks: ${OIDC_JWKS:http://127.0.0.1:18112/realms/service-requests/protocol/openid-connect/certs}
  oidc-audience: service-request-api
  public-url: ${APP_PUBLIC_URL:http://127.0.0.1:18110/}
  sla-scan-interval-ms: ${SLA_SCAN_INTERVAL_MS:15000}
